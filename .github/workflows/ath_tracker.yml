name: ATH Tracker + Update Bot

on:
  schedule:
    - cron: '* * * * *'   # every 1 min — this is also your /update reply latency
  workflow_dispatch:

permissions:
  contents: write   # needed to commit updated ath_state.json (alert steps + telegram offset)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for /update and run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 github_bot.py

      - name: Persist state (alert steps + telegram offset)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ath_state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
